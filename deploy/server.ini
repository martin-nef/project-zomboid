# Applied on every start to <cachedir>/Server/<SERVER_NAME>.ini, one key=value
# per line. Keys not listed here keep whatever the server (or an admin) last
# wrote. Password and RCONPassword come from the secret.
PublicName=Stray Dogs
Public=false
UPnP=false
DefaultPort=16261
UDPPort=16262
RCONPort=27015
# Project Viewpoint needs ZombieBuddy, which start.sh also loads as a Java
# agent. The server downloads Workshop items itself on start; players get them
# on joining.
Mods=\ZombieBuddy;\Viewpoint
WorkshopItems=3619862853;3809306528
DoLuaChecksum=true
