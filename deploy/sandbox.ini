# Applied on every start to <cachedir>/Server/<SERVER_NAME>_SandboxVars.lua,
# one option per line: Key=value, or Table.Key=value for options nested one
# level down. Values are Lua (true/false, numbers, "strings"). Options not
# listed keep whatever the file has (the world's settings, or an admin's
# edits). The comments in that file list each option's choices.

# Certain melee weapons can hit several zombies in one swing.
MultiHitZombies=true
# Knox Virus spread: 1 = Blood and Saliva, 2 = Saliva Only, 3 = Everyone's
# Infected, 4 = None.
ZombieLore.Transmission=2
# In-game minutes to read one page of a skill book (default 2.0); 0.02 reads
# 100x faster.
MinutesPerPage=0.02
# Skill XP rate for all skills (MultiplierConfig.GlobalToggle is on, so it
# overrides the per-skill rates). Default 1.0.
MultiplierConfig.Global=3.0
# Plant growth speed, Min 0.1 Max 100. Default 1.0.
FarmingSpeedNew=10.0
