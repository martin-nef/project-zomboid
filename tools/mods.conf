# Input for tools/collection.py, which turns a Steam Workshop collection into
# the Mods=, WorkshopItems= and Map= lines of deploy/server.ini. Every mod in
# every item of the collection gets enabled unless it is excluded here.
#
#   collection <workshop id>   the collection to follow
#   item <workshop id>         extra item that isn't in the collection
#   exclude <mod id>           keep this mod (one of several in an item) disabled
#   first <mod id>             load this mod before everything else

collection 3825483274

# Mods that must load first, by their author's instructions.
first PROJECTRVInterior42

# Equipment UI: pick one of the two. The other is for mods that need the old ID.
exclude EQUIPMENT_UI

# Neat Building: the full mod already includes the rest. The author says not to
# combine it with the modular variants.
exclude Neat_Building_UIOnly
exclude Neat_Building_Railings
exclude Neat_Building_Buildables_SESCompat

# Vanilla Vehicles Animated: only the main mod. The SVU patch is for Standard
# Vehicle Upgrades (not installed), slow doors needs Fancy Handwork (not
# installed) and is deprecated like PikamyDelight, and the rest are optional
# tweaks.
exclude VanillaVehiclesAnimated_SVU
exclude VVA_cullseats
exclude VVA_slowdoors
exclude VVA_snapDoors
exclude VVA_PikamyDelight
exclude VVA_transparentWindows

# Guns of Marz: the item also ships the old version, which is incompatible with
# the current one.
exclude MarzGuns
